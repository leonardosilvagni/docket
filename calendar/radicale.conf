# Radicale (CalDAV server) for the optional Docket calendar.
# Listens on all interfaces *inside* the container; docker-compose.calendar.yml
# publishes it on 127.0.0.1 only, and Tailscale is the only way in from your phone.
[server]
hosts = 0.0.0.0:5232

[auth]
type = htpasswd
# written at container start from RADICALE_USER / RADICALE_PASSWORD in .env
htpasswd_filename = /tmp/users
htpasswd_encryption = plain

[storage]
filesystem_folder = /data/collections

[logging]
level = warning
